api: officials
directory: api/officials/
name: item (endpoint)
file: item.php
path: api/officials/item.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve a single executive official
access: superadmin only (session required)
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: id
      type: int (from hidden)
      required: true
      source: js (url)
      description: id of an official
response:
  content_type: application/json
  http_code:
    success: 200
    errors: 401 | 404 | 405 | 422 | 500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - name: official
          type: object
          returned: on success
          description: official information
          properties:
            - every column in officials table = refer to db (biography can be null)
            - name: created_by
              type: string
              returned: always (can be null)
              description: username of the user who created the official
            - name: updated_by
              type: string
              returned: always (can be null)
              description: username of the user who last updated the official

Example:
HTTP Status: 200
Response: {
  "message": "Official successfully fetched.",
  "data": {
    "official": {
      "id": 2,
      "name": "Dr. Elena Villanueva",
      "position": "Vice President for Academic Affairs",
      "biography": null,
      "featured_image": "61a067af9ff6c181e4f7e05ed21dae07.webp",
      "order_number": 2,
      "status": "inactive",
      "author_id": 1,
      "editor_id": 1,
      "created_at": "2026-10-28 09:25:06",
      "updated_at": "2026-10-28 10:02:11",
      "active": 1,
      "created_by": "mky",
      "updated_by": "mky"
    }
  }
}
