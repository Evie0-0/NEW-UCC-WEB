api: units
directory: api/units/
name: filter (endpoint)
file: filter.php
path: api/units/filter.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve filtered units (colleges) and some metadata (10 results per page)
authorization: superadmin only
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: search
      type: string (from search)
      required: false (can be empty)
      source: js (url)
      description: searches for unit names and dean names
    - name: filter
      type: string (from selection)
      required: false (defaults to all)
      source: js (url)
      description: filter status of items
      note: the page labels Active and Hidden are stored as active and inactive
      values:
        - all
        - active
        - inactive
    - name: sort
      type: string (from selection)
      required: false (defaults to name-asc)
      source: js (url)
      description: sort items
      note: the page option values newest and oldest map to create-desc and create-asc
      values:
        - name-asc
        - name-desc
        - create-desc
        - create-asc
    - name: page
      type: int (from hidden)
      required: false (defaults to 1)
      source: js (url)
      description: page number to retrieve units for
response:
  content_type: application/json
  http_code:
    success: 200
    errors: ~400 - ~500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - name: units
          type: array
          returned: always (can be empty)
          description: units information
          conditions:
            - after a successful request
          properties:
            - every column in units table = refer to db
            - name: created_by
              type: string
              returned: always (can be null)
              description: username of the user who created the unit
            - name: updated_by
              type: string
              returned: always (can be null)
              description: username of the user who last updated the unit
        - name: current_page
          type: int
          returned: always
          description: current page number
          conditions:
            - after a successful request
        - name: total_units
          type: int
          returned: always
          description: overall total of units regardless of page
          conditions:
            - after a successful request
        - name: total_pages
          type: int
          returned: always
          description: total number of pages (10 results per page)
          conditions:
            - after a successful request
  errors:
    - status: 401
      message: You are unauthorized to make this request.
      when: the user is not logged in as superadmin
    - status: 405
      message: Invalid request method.
      when: the request method is not GET
    - status: 422
      message: Invalid filter selection. | Invalid sort selection. | Invalid page number. | Requested page does not exist.
      when: a parameter is invalid
    - status: 500
      message: An unexpected error occured.
      when: the server failed to process the request (see storage/logs/error.log)
example:
  http_status: 200
  response: |
    {
      "message": "Successfully filtered unit items.",
      "data": {
        "units": [
          {
            "id": 4,
            "name": "College of Computer Studies",
            "logo": "bf6093f4da380c06b20a994a548466fb.webp",
            "dean": "Dr. Maria Santos",
            "dean_image": null,
            "status": "active",
            "author_id": 1,
            "editor_id": null,
            "created_at": "2026-10-28 09:15:00",
            "updated_at": null,
            "active": 1,
            "created_by": "mky",
            "updated_by": null
          }
        ],
        "current_page": 1,
        "total_units": 1,
        "total_pages": 1
      }
    }
