title: Posts API Documentation
api:
  name: posts
  directory: api/posts/
  endpoints:
    - name: save
      file: save.php
      path: api/posts/save.php
      use_alerts:
        success: true
        failure: true
      description: saves a post
      request:
        method: POST
        source: FormData
        fields:
          - name: id
            type: int (from text or number)
            required: false (to determine whether to edit or create post)
            source: form or js (append)
            description: id of post when editing
          - name: title
            type: string (from text)
            required: true
            source: form
            description: title of post
          - name: excerpt
            type: string (from text)
            required: true
            source: form
            description: excerpt of post
          - name: content
            type: string (from text)
            required: true
            source: form
            description: content of post
          - name: remove_featured_image
            type: bool (from hidden)
            required: false (to determine whether to remove or use existing image)
            source: form or js (append)
            description: determines whether stored image should be removed
          - name: featured_image
            type: file (from hidden)
            required: false (optional)
            source: form or js (append)
            description: image of post
          - name: category
            type: int (from selection)
            required: true
            source: form
            description: category of post
            values:
              - 1
              - 2
              - 3
              - refer to categories table (id table) of db for the updated
          - name: status
            type: string (from selection)
            required: true
            source: form
            description: status of post
            values:
              - draft
              - published
          - name: publish_date
            type: string (from date)
            required: true
            source: form
            description: publish date of post
          - name: expiration_date
            type: string (from date)
            required: true
            source: form
            description: expiration date of post
      response:
        content_type: application/json
        http_code:
          success: 201 | 200
          errors: ~400 - ~500
        fields:
          - name: message
            type: string
            returned: always
            description: a message describing the outcome of the request
            conditions:
              - after a successful or unsuccessful operation
          - name: data
            type: object
            returned: always (can be empty - empty in this case)
            direct_access: true (empty)
            description: contains the data returned by the endpoint
            conditions:
              - successful request
              - unsuccessful request (empty)
            properties:
              - None
    - name: filter
      file: filter.php
      path: api/posts/filter.php
      use_alerts:
        success: false
        failure: true
      description: retrieve filtered posts items
      request:
        method: GET
        source: URLSearchParams
        fields:
          - name: search
            type: string (from search)
            required: false
            source: js (url)
            description: searches for post titles
          - name: filter
            type: string (from selection)
            required: true
            source: js (url)
            description: filter status of items
            values:
              - all
              - draft
              - published
              - pending
              - expired
          - name: sort
            type: string (from selection)
            required: true
            source: js (url)
            description: sort items
            values:
              - created-desc
              - created-asc
              - title-desc
              - title-asc
              - publish-desc
              - publish-asc
              - expiration-desc
              - expiration-asc
        response:
          content_type: application/json
          http_code:
            success: 200
            errors: ~400 - ~500
          fields:
            - name: message
              type: string
              returned: always
              description: a message describing the outcome of the request
              conditions:
                - after a successful or unsuccessful operation
              note:
               - do not include for alert upon success
            - name: data
              type: object
              returned: always (can be empty)
              direct_access: false (in array)
              description: contains the data returned by the endpoint
              conditions:
                - successful request
                - unsuccessful request (empty)
              properties:
               - every column in posts table
               - name: display_status
                 type: string
                 returned: always
                 description: name of status
                 conditions:
                   - after a successful request
                   - if result exists
    - name: item
      file: item.php
      path: api/posts/item.php
      use_alerts:
        success: true
        failure: true
      description: retrive a post
      request:
        method: GET
        source: URLSearchParams
        fields:
          - name: id
            type: int (from text)
            required: true
            source: js (url)
            description: id of a post
      response:
        content_type: application/json
        http_code:
          success: 200
          error: ~400 - ~500
        fields:
          - name: message
            type: string
            returned: always
            description: a message describing the outcome of the request
            conditions:
              - after a successful or unsuccessful operation
            note:
              - do not include for alert upon success
          - name: data
            type: object
            returned: always (can be empty)
            direct_access: true
            description: contains the data returned by the endpoint
            conditions:
              - successful request
              - unsuccessful request (empty)
            properties:
              - every column in posts table
          - name: display_status
            type: string
            returned: always
            description: name of status
            conditions:
              - after a successful request
              - if result exists
    - name: archive
      file: archive.php
      path: api/posts/archive.php
      use_alerts:
        success: true
        failure: true
      description: archives an existing post
      request:
        method: POST
        source: FormData
        fields:
          - name: id
            type: int (from text or hidden)
            required: true
            source: js (append)
            description: id of post to archive
      response:
        content_type: application/json
        http_code:
          success: 200
          errors: ~400 - ~500
        fields:
          - name: message
            type: string
            returned: always
            description: a message describing the outcome of the request
            conditions:
              - after a successful or unsuccessful operation
          - name: data
            type: object
            returned: always (can be empty - empty in this case)
            direct_access: true (empty)
            description: contains the data returned by the endpoint
            conditions:
              - successful request
              - unsuccessful request (empty)
            properties:
              - None
