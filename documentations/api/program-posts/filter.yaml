api: program-posts
directory: api/program-posts/
name: filter (endpoint)
file: filter.php
path: api/program-posts/filter.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve filtered program post items and some metadata (10 results per page)
access: superadmin only (session required)
note: the filter all includes archived posts (the program posts page lists them with a Restore button); every other filter excludes them. The list leaves out the content column; use the item endpoint to get it
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: search
      type: string (from search)
      required: false (can be empty)
      source: js (url)
      description: searches for post title, excerpt and program name
    - name: program_id
      type: int (from selection)
      required: false (empty = all programs)
      source: js (url)
      description: only return posts of this program (programs.id)
    - name: filter
      type: string (from selection)
      required: false (defaults to all)
      source: js (url)
      description: filter status of items
      values:
        - all
        - draft
        - published
        - pending
        - expired
        - archived
      note: case-insensitive. published = published, already live and not expired; pending = published but the publish date is still in the future; expired = published but the expiry date has passed; archived = archived_at is set
    - name: sort
      type: string (from selection)
      required: false (defaults to newest)
      source: js (url)
      description: sort items
      values:
        - newest
        - oldest
        - title
        - expiry-asc
        - expiry-desc
      note: title = A to Z. Posts without an expiry date always go last in both expiry sorts
    - name: page
      type: int (from hidden)
      required: false (defaults to 1)
      source: js (url)
      description: page number to retrieve program posts for
response:
  content_type: application/json
  http_code:
    success: 200
    errors: 401 | 405 | 422 | 500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - name: program_posts
          type: array
          returned: always (can be empty)
          description: program post information
          conditions:
            - after a successful request
          properties:
            - every column in program_posts table except content = refer to db
            - name: display_status
              type: string
              returned: always
              description: status shown on the page
              values:
                - draft
                - published
                - pending
                - expired
                - archived
            - name: has_expiry
              type: int (1 or 0)
              returned: always
              description: 0 when the post has no expiry date (expires_at is stored as 9999-12-31)
            - name: program_name
              type: string
              returned: always (can be null)
              description: name of the program
            - name: category_name
              type: string
              returned: always (can be null)
              description: name of the category
            - name: created_by
              type: string
              returned: always (can be null)
              description: username of the user who created the post
            - name: updated_by
              type: string
              returned: always (can be null)
              description: username of the user who last updated the post
        - name: current_page
          type: int
          returned: always
          description: current page number
          conditions:
            - after a successful request
        - name: total_program_posts
          type: int
          returned: always
          description: overall total of program posts matching the filters regardless of page
          conditions:
            - after a successful request
        - name: total_pages
          type: int
          returned: always
          description: total number of pages (10 results per page)
          conditions:
            - after a successful request

Example:
HTTP Status: 200
Response: {
  "message": "Successfully filtered program post items.",
  "data": {
    "program_posts": [
      {
        "id": 1,
        "title": "BSCS Hosts Programming Contest",
        "excerpt": "The annual inter-year programming contest.",
        "featured_image": null,
        "program_id": 2,
        "category_id": 8,
        "views": 0,
        "status": "published",
        "author_id": 1,
        "editor_id": null,
        "published_at": "2026-10-28 00:00:00",
        "expires_at": "9999-12-31 00:00:00",
        "archived_at": null,
        "created_at": "2026-10-28 09:25:06",
        "updated_at": null,
        "active": 1,
        "display_status": "published",
        "has_expiry": 0,
        "program_name": "Bachelor of Science in Public Administration",
        "category_name": "Program News",
        "created_by": "mky",
        "updated_by": null
      }
    ],
    "current_page": 1,
    "total_program_posts": 1,
    "total_pages": 1
  }
}
