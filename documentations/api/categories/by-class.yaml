api: categories
directory: api/categories/
name: by-class (endpoint)
file: by-class.php
path: api/categories/by-class.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve category values by class
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: class
      type: string (from text)
      required: true
      source: js (url)
      description: class of the category to use
      values:
        - university-posts
        - unit-posts
        - program-posts
        - refer to categories table (class column) of db for the updated
response:
  content_type: application/json
  http_code:
    success: 200
    error: ~400-~500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success or unsuccess
    - name: data
      type: object
      returned: always (can be empty)
      direct_access: false (in array)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - every column in categories table = refer to db
