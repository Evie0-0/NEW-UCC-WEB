api: about
directory: api/about/
name: filter (endpoint)
file: filter.php
path: api/about/filter.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve filtered about ucc posts and some metadata (10 results per page)
authorization: superadmin only
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: search
      type: string (from search)
      required: false (can be empty)
      source: js (url)
      description: searches for about post names and descriptions
    - name: filter
      type: string (from selection)
      required: false (defaults to all)
      source: js (url)
      description: filter status of items
      note: the page labels Active and Hidden are stored as active and inactive
      values:
        - all
        - active
        - inactive
    - name: category
      type: string or int (from selection)
      required: false (defaults to all)
      source: js (url)
      description: filter items by category
      values:
        - all
        - 9 (About UCC)
        - 10 (History)
        - 11 (New UCC)
        - 12 (Opportunities)
        - refer to categories table (id column) of db where class is about
    - name: sort
      type: string (from selection)
      required: false (defaults to create-asc)
      source: js (url)
      description: sort items
      values:
        - create-desc
        - create-asc
        - name-asc
        - name-desc
    - name: page
      type: int (from hidden)
      required: false (defaults to 1)
      source: js (url)
      description: page number to retrieve about posts for
response:
  content_type: application/json
  http_code:
    success: 200
    errors: ~400 - ~500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - name: about
          type: array
          returned: always (can be empty)
          description: about posts information
          conditions:
            - after a successful request
          properties:
            - every column in about table = refer to db
            - name: category_name
              type: string
              returned: always
              description: name of the category of the post
            - name: created_by
              type: string
              returned: always (can be null)
              description: username of the user who created the post
            - name: updated_by
              type: string
              returned: always (can be null)
              description: username of the user who last updated the post
        - name: current_page
          type: int
          returned: always
          description: current page number
          conditions:
            - after a successful request
        - name: total_about
          type: int
          returned: always
          description: overall total of about posts regardless of page
          conditions:
            - after a successful request
        - name: total_pages
          type: int
          returned: always
          description: total number of pages (10 results per page)
          conditions:
            - after a successful request
  errors:
    - status: 401
      message: You are unauthorized to make this request.
      when: the user is not logged in as superadmin
    - status: 405
      message: Invalid request method.
      when: the request method is not GET
    - status: 422
      message: Invalid filter selection. | Invalid category selection. | Invalid sort selection. | Invalid page number. | Requested page does not exist.
      when: a parameter is invalid
    - status: 500
      message: An unexpected error occured.
      when: the server failed to process the request (see storage/logs/error.log)
example:
  http_status: 200
  response: |
    {
      "message": "Successfully filtered about items.",
      "data": {
        "about": [
          {
            "id": 1,
            "name": "About University of Caloocan City",
            "description": "Learn about UCC, its history, mission, and commitment to quality education.",
            "featured_image": "bf6093f4da380c06b20a994a548466fb.webp",
            "category_id": 9,
            "status": "active",
            "author_id": 1,
            "editor_id": null,
            "created_at": "2026-10-28 09:15:00",
            "updated_at": null,
            "active": 1,
            "category_name": "About UCC",
            "created_by": "mky",
            "updated_by": null
          }
        ],
        "current_page": 1,
        "total_about": 1,
        "total_pages": 1
      }
    }
