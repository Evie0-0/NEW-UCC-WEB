title: Categories API Documentation
api:
  - name: by-class
    directory: api/categories/
    endpoints:
      - name: by-class
        file: by-class.php
        path: api/categories/by-class.php
        use_alerts:
          success: false
          failure: false
        description: retrieve category values by class
        request:
          method: GET
          source: URLSearchParams
          fields:
            - name: class
              type: string (from text)
              required: true
              source: js (url)
              description: class of category = refer to db
        response:
          content_type: application/json
          http_code:
            success: 200
            error: ~400-~500
          fields:
            - name: message
              type: string
              returned: always
              description: a message describing the outcome of the request
              conditions:
                - after a successful or unsuccessful operation
              note:
                - do not include for alert upon success or unsuccess
            - name: data
              type: object
              returned: always (can be empty)
              direct_access: false (in array)
              description: contains the data returned by the endpoint
              conditions:
                - successful request
                - unsuccessful request (empty)
              properties:
               - every column in posts table
