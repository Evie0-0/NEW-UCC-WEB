api: officials
directory: api/officials/
name: filter (endpoint)
file: filter.php
path: api/officials/filter.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve filtered executive official items and some metadata (10 results per page)
access: superadmin only (session required)
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: search
      type: string (from search)
      required: false (can be empty)
      source: js (url)
      description: searches for official name, position and biography
    - name: filter
      type: string (from selection)
      required: false (defaults to all)
      source: js (url)
      description: filter status of items
      values:
        - all
        - active
        - inactive
      note: case-insensitive; hidden is accepted as an alias of inactive (the executive page labels it Hidden)
    - name: sort
      type: string (from selection)
      required: false (defaults to ascending)
      source: js (url)
      description: sort items
      values:
        - ascending
        - descending
        - name
      note: ascending = display order low to high, descending = display order high to low, name = name A to Z. Ties are broken by id
    - name: page
      type: int (from hidden)
      required: false (defaults to 1)
      source: js (url)
      description: page number to retrieve officials for
response:
  content_type: application/json
  http_code:
    success: 200
    errors: 401 | 405 | 422 | 500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - name: officials
          type: array
          returned: always (can be empty)
          description: official information
          conditions:
            - after a successful request
          properties:
            - every column in officials table = refer to db (biography can be null)
            - name: created_by
              type: string
              returned: always (can be null)
              description: username of the user who created the official
            - name: updated_by
              type: string
              returned: always (can be null)
              description: username of the user who last updated the official
        - name: current_page
          type: int
          returned: always
          description: current page number
          conditions:
            - after a successful request
        - name: total_officials
          type: int
          returned: always
          description: overall total of officials matching the filters regardless of page
          conditions:
            - after a successful request
        - name: total_pages
          type: int
          returned: always
          description: total number of pages (10 results per page)
          conditions:
            - after a successful request

Example:
HTTP Status: 200
Response: {
  "message": "Successfully filtered official items.",
  "data": {
    "officials": [
      {
        "id": 1,
        "name": "Dr. Ricardo Dela Cruz",
        "position": "University President",
        "biography": "Leads the university's academic, administrative, and strategic direction.",
        "featured_image": null,
        "order_number": 1,
        "status": "active",
        "author_id": 1,
        "editor_id": null,
        "created_at": "2026-10-28 09:25:06",
        "updated_at": null,
        "active": 1,
        "created_by": "mky",
        "updated_by": null
      }
    ],
    "current_page": 1,
    "total_officials": 1,
    "total_pages": 1
  }
}
