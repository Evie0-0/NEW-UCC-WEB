api: unit-posts
directory: api/unit-posts/
name: item (endpoint)
file: item.php
path: api/unit-posts/item.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve a single unit post (including its content)
access: superadmin only (session required)
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: id
      type: int (from hidden)
      required: true
      source: js (url)
      description: id of a unit post
response:
  content_type: application/json
  http_code:
    success: 200
    errors: 401 | 404 | 405 | 422 | 500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - name: unit_post
          type: object
          returned: on success
          description: unit post information
          properties:
            - every column in unit_posts table = refer to db
            - display_status, has_expiry, unit_name, category_name, created_by and updated_by = same as the filter endpoint

Example:
HTTP Status: 200
Response: {
  "message": "Unit post successfully fetched.",
  "data": {
    "unit_post": {
      "id": 1,
      "title": "CAS Holds Annual Research Congress",
      "excerpt": "Faculty and students presented their latest research projects.",
      "content": "",
      "featured_image": null,
      "unit_id": 1,
      "category_id": 7,
      "views": 0,
      "status": "published",
      "author_id": 1,
      "editor_id": null,
      "published_at": "2026-10-28 00:00:00",
      "expires_at": "9999-12-31 00:00:00",
      "archived_at": null,
      "created_at": "2026-10-28 09:25:06",
      "updated_at": null,
      "active": 1,
      "display_status": "published",
      "has_expiry": 0,
      "unit_name": "College of Arts and Sciences",
      "category_name": "Unit News",
      "created_by": "mky",
      "updated_by": null
    }
  }
}
