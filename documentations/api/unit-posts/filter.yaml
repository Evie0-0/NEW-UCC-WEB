api: unit-posts
directory: api/unit-posts/
name: filter (endpoint)
file: filter.php
path: api/unit-posts/filter.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve filtered unit post items and some metadata (10 results per page)
access: superadmin only (session required)
note: archived posts (archived_at is set) and posts whose unit has been deleted are not returned. The list leaves out the content column; use the item endpoint to get it
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: search
      type: string (from search)
      required: false (can be empty)
      source: js (url)
      description: searches for post title, excerpt and unit name
    - name: unit_id
      type: int (from selection)
      required: false (empty = all units)
      source: js (url)
      description: only return posts of this unit
    - name: filter
      type: string (from selection)
      required: false (defaults to all)
      source: js (url)
      description: filter status of items
      values:
        - all
        - draft
        - published
        - pending
        - expired
      note: case-insensitive. published = published, already live and not expired; pending = published but the publish date is still in the future; expired = published but the expiry date has passed
    - name: sort
      type: string (from selection)
      required: false (defaults to newest)
      source: js (url)
      description: sort items
      values:
        - newest
        - oldest
        - title-asc
        - title-desc
        - expiry-asc
        - expiry-desc
      note: posts without an expiry date always go last in both expiry sorts
    - name: page
      type: int (from hidden)
      required: false (defaults to 1)
      source: js (url)
      description: page number to retrieve unit posts for
response:
  content_type: application/json
  http_code:
    success: 200
    errors: 401 | 405 | 422 | 500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - name: unit_posts
          type: array
          returned: always (can be empty)
          description: unit post information
          conditions:
            - after a successful request
          properties:
            - every column in unit_posts table except content = refer to db
            - name: display_status
              type: string
              returned: always
              description: status shown on the page
              values:
                - draft
                - published
                - pending
                - expired
            - name: has_expiry
              type: int (1 or 0)
              returned: always
              description: 0 when the post has no expiry date (expires_at is stored as 9999-12-31)
            - name: unit_name
              type: string
              returned: always
              description: name of the unit
            - name: category_name
              type: string
              returned: always (can be null)
              description: name of the category
            - name: created_by
              type: string
              returned: always (can be null)
              description: username of the user who created the post
            - name: updated_by
              type: string
              returned: always (can be null)
              description: username of the user who last updated the post
        - name: current_page
          type: int
          returned: always
          description: current page number
          conditions:
            - after a successful request
        - name: total_unit_posts
          type: int
          returned: always
          description: overall total of unit posts matching the filters regardless of page
          conditions:
            - after a successful request
        - name: total_pages
          type: int
          returned: always
          description: total number of pages (10 results per page)
          conditions:
            - after a successful request

Example:
HTTP Status: 200
Response: {
  "message": "Successfully filtered unit post items.",
  "data": {
    "unit_posts": [
      {
        "id": 1,
        "title": "CAS Holds Annual Research Congress",
        "excerpt": "Faculty and students presented their latest research projects.",
        "featured_image": null,
        "unit_id": 1,
        "category_id": 7,
        "views": 0,
        "status": "published",
        "author_id": 1,
        "editor_id": null,
        "published_at": "2026-10-28 00:00:00",
        "expires_at": "9999-12-31 00:00:00",
        "archived_at": null,
        "created_at": "2026-10-28 09:25:06",
        "updated_at": null,
        "active": 1,
        "display_status": "published",
        "has_expiry": 0,
        "unit_name": "College of Arts and Sciences",
        "category_name": "Unit News",
        "created_by": "mky",
        "updated_by": null
      }
    ],
    "current_page": 1,
    "total_unit_posts": 1,
    "total_pages": 1
  }
}
