title: Categories API Documentation
api:
  - name: by-class
    directory: api/categories/
    endpoints:
      - name: by-class
        file: by-class.php
        path: api/categories/by-class.php
        with_alert: false
        description: retrieve category values by class
        request:
          method: GET
          source: URLSearchParams
          fields:
            - name: class
              type: string
              required: true
              description: class of category = refer to db
        response:
          content_type: application/json
          http_code:
            success: 200
            error: ~400-~500
          fields:
            - name: data
              type: object
              returned: always
              description: contains the data returned by the endpoint
              conditions:
                - after a successful request
              properties:
                - name: id
                  type: int
                  returned: sometimes
                  description: id of the category
                  conditions:
                    - after successful request
                    - if result exists
                - name: name
                  type: string
                  returned: somtimes
                  description: name of the category
                  conditions:
                    - after successful request
                    - if result exists
