title: Officials API Documentation
api:
  name: officials
  directory: api/officials/
  endpoints:
  - name: filter
    file: filter.php
    path: api/officials/filter.php
    use_alerts:
      success: false
      failure: true
    description: retrieve filtered executive official items and some metadata (10 results per page)
    access: superadmin only (session required)
    request:
      method: GET
      source: URLSearchParams
      fields:
      - name: search
        type: string (from search)
        required: false (can be empty)
        source: js (url)
        description: searches for official name, position and biography
      - name: filter
        type: string (from selection)
        required: false (defaults to all)
        source: js (url)
        description: filter status of items
        values:
        - all
        - active
        - inactive
        note: case-insensitive; hidden is accepted as an alias of inactive (the executive page labels it Hidden)
      - name: sort
        type: string (from selection)
        required: false (defaults to ascending)
        source: js (url)
        description: sort items
        values:
        - ascending
        - descending
        - name
        note: ascending = display order low to high, descending = display order high to low, name = name A to Z. Ties are broken by id
      - name: page
        type: int (from hidden)
        required: false (defaults to 1)
        source: js (url)
        description: page number to retrieve officials for
    response:
      content_type: application/json
      http_code:
        success: 200
        errors: 401 | 405 | 422 | 500
      fields:
      - name: message
        type: string
        returned: always
        description: a message describing the outcome of the request
        conditions:
        - after a successful or unsuccessful operation
        note:
        - do not include for alert upon success
      - name: data
        type: object
        returned: always (can be empty)
        description: contains the data returned by the endpoint
        conditions:
        - successful request
        - unsuccessful request (empty)
        properties:
        - name: officials
          type: array
          returned: always (can be empty)
          description: official information
          conditions:
          - after a successful request
          properties:
          - every column in officials table = refer to db (biography can be null)
          - name: created_by
            type: string
            returned: always (can be null)
            description: username of the user who created the official
          - name: updated_by
            type: string
            returned: always (can be null)
            description: username of the user who last updated the official
        - name: current_page
          type: int
          returned: always
          description: current page number
          conditions:
          - after a successful request
        - name: total_officials
          type: int
          returned: always
          description: overall total of officials matching the filters regardless of page
          conditions:
          - after a successful request
        - name: total_pages
          type: int
          returned: always
          description: total number of pages (10 results per page)
          conditions:
          - after a successful request
    example: |-
      Example:
      HTTP Status: 200
      Response: {
        "message": "Successfully filtered official items.",
        "data": {
          "officials": [
            {
              "id": 1,
              "name": "Dr. Ricardo Dela Cruz",
              "position": "University President",
              "biography": "Leads the university's academic, administrative, and strategic direction.",
              "featured_image": null,
              "order_number": 1,
              "status": "active",
              "author_id": 1,
              "editor_id": null,
              "created_at": "2026-10-28 09:25:06",
              "updated_at": null,
              "active": 1,
              "created_by": "mky",
              "updated_by": null
            }
          ],
          "current_page": 1,
          "total_officials": 1,
          "total_pages": 1
        }
      }
  - name: item
    file: item.php
    path: api/officials/item.php
    use_alerts:
      success: false
      failure: true
    description: retrieve a single executive official
    access: superadmin only (session required)
    request:
      method: GET
      source: URLSearchParams
      fields:
      - name: id
        type: int (from hidden)
        required: true
        source: js (url)
        description: id of an official
    response:
      content_type: application/json
      http_code:
        success: 200
        errors: 401 | 404 | 405 | 422 | 500
      fields:
      - name: message
        type: string
        returned: always
        description: a message describing the outcome of the request
        conditions:
        - after a successful or unsuccessful operation
        note:
        - do not include for alert upon success
      - name: data
        type: object
        returned: always (can be empty)
        description: contains the data returned by the endpoint
        conditions:
        - successful request
        - unsuccessful request (empty)
        properties:
        - name: official
          type: object
          returned: on success
          description: official information
          properties:
          - every column in officials table = refer to db (biography can be null)
          - name: created_by
            type: string
            returned: always (can be null)
            description: username of the user who created the official
          - name: updated_by
            type: string
            returned: always (can be null)
            description: username of the user who last updated the official
    example: |-
      Example:
      HTTP Status: 200
      Response: {
        "message": "Official successfully fetched.",
        "data": {
          "official": {
            "id": 2,
            "name": "Dr. Elena Villanueva",
            "position": "Vice President for Academic Affairs",
            "biography": null,
            "featured_image": "61a067af9ff6c181e4f7e05ed21dae07.webp",
            "order_number": 2,
            "status": "inactive",
            "author_id": 1,
            "editor_id": 1,
            "created_at": "2026-10-28 09:25:06",
            "updated_at": "2026-10-28 10:02:11",
            "active": 1,
            "created_by": "mky",
            "updated_by": "mky"
          }
        }
      }
  - name: save
    file: save.php
    path: api/officials/save.php
    use_alerts:
      success: true
      failure: true
    description: saves an executive official (creates it when id is 0, updates it otherwise)
    access: superadmin only (session + csrf token required)
    note: the public website finds the university president by id = 1 AND position exactly equal to University President, so changing that text on official 1 (or deleting or hiding it) removes the president section from the public page
    request:
      method: POST
      source: FormData
      fields:
      - name: csrf_key
        type: string (from hidden)
        required: true
        source: js (append)
        description: csrf token to avoid cross site request forgery
        note: use Token::generate() on hidden input
      - name: id
        type: int (from hidden)
        required: true (to determine whether to edit or create - 0 when creating)
        source: js (append)
        description: id of the official when editing
      - name: name
        type: string (from text)
        required: true
        source: form
        description: full name of the official
        note: maximum of 150 characters (officials.name column)
      - name: position
        type: string (from text)
        required: true
        source: form
        description: position of the official
        note: maximum of 150 characters (officials.position column)
      - name: biography
        type: string (from textarea)
        required: false (blank is stored as null)
        source: form
        description: biography or short description
        note: maximum of 5000 characters (an API limit, the form has none)
      - name: order_number
        type: int (from number)
        required: true
        source: form
        description: display order on the public website
        note: whole number of 1 or more. Duplicates are allowed; ties are shown by id
      - name: status
        type: string (from selection)
        required: true
        source: form
        description: status of the official
        values:
        - active
        - inactive
        note: case-insensitive, so the form values Active / Inactive are accepted; hidden is also accepted as an alias of inactive
      - name: featured_image
        type: file (from file input)
        required: false
        source: form or js (append)
        description: photo of the official
        note: JPEG, PNG or WebP, maximum of 10 MB and 5000 x 5000 pixels
      - name: remove_featured_image
        type: bool (from hidden)
        required: false (update only)
        source: js (append)
        description: determines whether the stored photo should be removed
        note: cannot be combined with a new featured_image in the same request
    response:
      content_type: application/json
      http_code:
        success: 201 (created) | 200 (updated)
        errors: 400 | 401 | 403 | 404 | 405 | 413 | 415 | 422 | 500
      fields:
      - name: message
        type: string
        returned: always
        description: a message describing the outcome of the request
        conditions:
        - after a successful or unsuccessful operation
      - name: data
        type: object
        returned: always (can be empty - empty in this case)
        description: contains the data returned by the endpoint
        conditions:
        - successful request (empty)
        - unsuccessful request (empty)
        properties:
        - None
    example: |-
      Example:
      HTTP Status: 201
      Response: {
        "message": "Official successfully created.",
        "data": []
      }

      HTTP Status: 200
      Response: {
        "message": "Official successfully updated.",
        "data": []
      }
  - name: delete
    file: delete.php
    path: api/officials/delete.php
    use_alerts:
      success: true
      failure: true
    description: deletes an executive official (soft delete - the row is kept with active = 0 and recorded in the audit trail)
    access: superadmin only (session + csrf token required)
    request:
      method: POST
      source: FormData
      fields:
      - name: csrf_key
        type: string (from hidden)
        required: true
        source: js (append)
        description: csrf token to avoid cross site request forgery
        note: use Token::generate() on hidden input
      - name: id
        type: int (from table row)
        required: true
        source: js (append)
        description: id of the official to delete
    response:
      content_type: application/json
      http_code:
        success: 200
        errors: 401 | 403 | 404 | 405 | 422 | 500
      fields:
      - name: message
        type: string
        returned: always
        description: a message describing the outcome of the request
        conditions:
        - after a successful or unsuccessful operation
      - name: data
        type: object
        returned: always (can be empty - empty in this case)
        description: contains the data returned by the endpoint
        conditions:
        - successful request (empty)
        - unsuccessful request (empty)
        properties:
        - None
    example: |-
      Example:
      HTTP Status: 200
      Response: {
        "message": "Official successfully deleted.",
        "data": []
      }
