api: calendar
directory: api/calendar/
name: save (endpoint)
file: save.php
path: api/calendar/save.php
use_alerts:
  upon_success: true
  upon_failure: true
description: creates or updates a calendar event
authorization: superadmin only
request:
  method: POST
  source: FormData
  fields:
  - name: csrf_key
    type: string (from hidden)
    required: true
    source: js (append)
    description: csrf token to avoid cross scripting
    note: use Token::generate() on hidden input
  - name: id
    type: int (from hidden)
    required: true (to determine whether to edit or create event - 0 when creating event)
    source: form or js (append)
    description: id of event when editing
  - name: title
    type: string (from text)
    required: true
    source: form
    description: title of event (maximum of 150 characters)
  - name: description
    type: string (from text)
    required: true
    source: form
    description: description of event
  - name: status
    type: string (from selection)
    required: true
    source: form
    description: status of event
    note: a published event is shown as pending until its publish date
    values:
    - draft
    - published
  - name: publish_date
    type: string (from date input)
    required: false (defaults to today)
    source: form
    description: date the event is published on the website
    note: format YYYY-MM-DD, the page field is named publishDate
  - name: start_date
    type: string (from date input)
    required: true
    source: form
    description: date the event starts
    note: format YYYY-MM-DD
  - name: end_date
    type: string (from date input)
    required: true
    source: form
    description: date the event ends (cannot be earlier than start_date)
    note: format YYYY-MM-DD
  - name: remove_featured_image
    type: bool (from hidden)
    required: false (defaults to false, only used when editing)
    source: form or js (append)
    description: determines whether the stored image should be removed
    note: cannot be true while a new featured_image is uploaded
  - name: featured_image
    type: file (from file input)
    required: false (optional)
    source: form or js (append)
    description: featured image (jpeg, png or webp, 10 MB maximum, 5000 x 5000 pixels maximum)
    note: when editing, the old image is replaced and deleted from storage/uploads
response:
  content_type: application/json
  http_code:
    success: 201 | 200
    errors: ~400 - ~500
  fields:
  - name: message
    type: string
    returned: always
    description: a message describing the outcome of the request
    conditions:
    - after a successful or unsuccessful operation
  - name: data
    type: object
    returned: always (can be empty - empty in this case)
    description: contains the data returned by the endpoint
    conditions:
    - successful request (empty)
    - unsuccessful request (empty)
    properties:
    - None
  errors:
  - status: 401
    message: You are unauthorized to make this request.
    when: the user is not logged in as superadmin
  - status: 403
    message: Invalid CSRF token.
    when: csrf_key is missing or wrong
  - status: 404
    message: Event does not exist.
    when: editing an id that does not exist
  - status: 405
    message: Invalid request method.
    when: the request method is not POST
  - status: 413 | 415 | 422
    message: image upload errors (too large, unsupported format, not a valid image)
    when: featured_image fails verification
  - status: 422
    message: Invalid event id. | Title cannot be empty. | Title cannot exceed 150 characters. | Description cannot be empty. | Invalid status selection. | Publish date must be a valid date (YYYY-MM-DD). | Start date must be a valid date (YYYY-MM-DD). | End date must be a valid date (YYYY-MM-DD). | End date cannot be earlier than the start date. | Invalid remove featured image indicator. | Cannot remove and replace featured image at the same time.
    when: a field is invalid
  - status: 500
    message: An unexpected error occured.
    when: the server failed to process the request (see storage/logs/error.log)
  side_effects:
  - an audit trail entry is created (CREATE or UPDATE, entity type Calendar Event)
example:
  http_status: 201
  response: |
    {
      "message": "Event successfully created.",
      "data": []
    }
