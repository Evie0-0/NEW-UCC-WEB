api: program-posts
directory: api/program-posts/
name: unarchive (endpoint)
file: unarchive.php
path: api/program-posts/unarchive.php
use_alerts:
  upon_success: true
  upon_failure: true
description: restores an archived program post (clears archived_at, sets its status to draft, and records an UNARCHIVE entry in the audit trail)
access: superadmin only (session + csrf token required)
request:
  method: POST
  source: FormData
  fields:
    - name: csrf_key
      type: string (from hidden)
      required: true
      source: js (append)
      description: csrf token to avoid cross site request forgery
      note: use Token::generate() on hidden input
    - name: id
      type: int (from table row)
      required: true
      source: js (append)
      description: id of the program post to restore
response:
  content_type: application/json
  http_code:
    success: 200
    errors: 401 | 403 | 404 | 405 | 422 | 500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - 422 with "Program post is already unarchived." when the post is not archived
    - name: data
      type: object
      returned: always (can be empty - empty in this case)
      description: contains the data returned by the endpoint
      conditions:
        - successful request (empty)
        - unsuccessful request (empty)
      properties:
        - None

Example:
HTTP Status: 200
Response: {
  "message": "Program post successfully unarchived. Its status has been set to draft.",
  "data": []
}
