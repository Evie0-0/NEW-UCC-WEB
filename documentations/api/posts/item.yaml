api: posts
directory: api/posts/
name: item (endpoint)
file: item.php
path: api/posts/item.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve a post
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: id
      type: int (from hidden)
      required: true
      source: js (url)
      description: id of a post
response:
  content_type: application/json
  http_code:
    success: 200
    error: ~400 - ~500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - every column in posts table
        - name: display_status
          type: string
          returned: always
          description: name of status
          conditions:
            - after a successful request
            - if result exists

Example:
HTTP Status: 200
Response: {
  "message": "Post successfully fetched.",
  "data": {
    "post": {
      "id": 11,
      "title": "Title 5",
      "excerpt": "Excerpt 5",
      "content": "Content 5",
      "featured_image": null,
      "category_id": 3,
      "views": 0,
      "status": "published",
      "author_id": 1,
      "editor_id": 1,
      "published_at": "2026-10-26 00:00:00",
      "expires_at": "2026-10-26 00:00:00",
      "archived_at": "2026-10-26 04:48:23",
      "created_at": "2026-10-26 04:32:29",
      "updated_at": "2026-10-26 04:48:23",
      "active": 1,
      "display_status": "expired"
    }
  }
}
