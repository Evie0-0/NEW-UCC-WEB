title: Posts API Documentation
api:
  name: posts
  directory: api/posts/
  endpoints:
    - name: save
      file: save.php
      path: api/posts/save.php
      with_alert: true
      description: saves a post
      request:
        method: POST
        source: FormData
        fields:
          - name: id
            type: int (from text or number)
            required: false
            source: form or js (append)
            description: id of post when editing
          - name: title
            type: string (from text)
            required: true
            source: form
            description: title of post
          - name: excerpt
            type: string (from text)
            required: true
            source: form
            description: excerpt of post
          - name: content
            type: string (from text)
            required: true
            source: form
            description: content of post
          - name: remove_featured_image
            type: bool (from hidden)
            required: false
            source: form or js (append)
            description: determines whether stored image should be removed
          - name: featured_image
            type: file (from hidden)
            required: false
            source: form or js (append)
            description: image of post
          - name: category
            type: int (from selection)
            required: true
            source: form
            description: category of post
          - name: status
            type: string (from selection)
            required: true
            source: form
            description: status of post
          - name: publish_date
            type: string (from date)
            required: true
            source: form
            description: publish date of post
          - name: expiration_date
            type: string (from date)
            required: true
            source: form
            description: expiration date of post
      response:
        content_type: application/json
        http_code:
          success: 201 | 200
          errors: ~400 - ~500
        fields:
          - name: message
            type: string
            returned: always
            description: a message describing the outcome of the request
            conditions:
              - after a successful or unsuccessful operation
          - name: data
            type: object
            returned: always (empty in this case)
            description: contains the data returned by the endpoint
            conditions:
              -
            properties:
