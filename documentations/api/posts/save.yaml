api: posts
directory: api/posts/
name: save (endpoint)
file: save.php
path: api/posts/save.php
use_alerts:
  upon_success: true
  upon_failure: true
description: saves a post
request:
  method: POST
  source: FormData
  fields:
    - name: csrf_key
      type: string (from hidden)
      required: true
      source: js (append)
      description: csrf token to avoid cross scripting
      note: use Token::generate() on hidden input
    - name: id
      type: int (from hidden)
      required: true (to determine whether to edit or create post - 0 when creating post)
      source: form or js (append)
      description: id of post when editing
    - name: title
      type: string (from text)
      required: true
      source: form
      description: title of post
    - name: excerpt
      type: string (from text)
      required: true
      source: form
      description: excerpt of post
    - name: content
      type: string (from text)
      required: true
      source: form
      description: content of post
    - name: remove_featured_image
      type: bool (from hidden)
      required: true (to determine whether to remove or use existing image)
      source: form or js (append)
      description: determines whether stored image should be removed
    - name: featured_image
      type: file (from hidden)
      required: true (optional)
      source: form or js (append)
      description: image of post
    - name: category
      type: int (from selection)
      required: true
      source: form
      description: category of post
      values:
        - 1
        - 2
        - 3
        - refer to categories table (id column) of db for the updated
    - name: status
      type: string (from selection)
      required: true
      source: form
      description: status of post
      values:
        - draft
        - published
    - name: publish_date
      type: string (from date)
      required: true
      source: form
      description: publish date of post
    - name: expiration_date
      type: string (from date)
      required: true
      source: form
      description: expiration date of post
  response:
    content_type: application/json
    http_code:
      success: 201 | 200
      errors: ~400 - ~500
    fields:
      - name: message
        type: string
        returned: always
        description: a message describing the outcome of the request
        conditions:
          - after a successful or unsuccessful operation
      - name: data
        type: object
        returned: always (can be empty - empty in this case)
        description: contains the data returned by the endpoint
        conditions:
          - successful request (empty)
          - unsuccessful request (empty)
        properties:
          - None

Example:
HTTP Status: 200
Response: {
  "message": "Post successfully updated.",
  "data": []
}
