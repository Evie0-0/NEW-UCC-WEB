api: eservices
directory: api/eservices/
name: item (endpoint)
file: item.php
path: api/eservices/item.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve a single e-service
access: superadmin only (session required)
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: id
      type: int (from hidden)
      required: true
      source: js (url)
      description: id of an e-service
response:
  content_type: application/json
  http_code:
    success: 200
    errors: 401 | 404 | 405 | 422 | 500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - name: eservice
          type: object
          returned: on success
          description: e-service information
          properties:
            - every column in eservices table = refer to db
            - name: created_by
              type: string
              returned: always (can be null)
              description: username of the user who created the e-service
            - name: updated_by
              type: string
              returned: always (can be null)
              description: username of the user who last updated the e-service

Example:
HTTP Status: 200
Response: {
  "message": "E-service successfully fetched.",
  "data": {
    "eservice": {
      "id": 1,
      "name": "Student Portal",
      "description": "Access grades, enrollment records, and student information.",
      "url": "https://example.com/student-portal",
      "featured_image": null,
      "status": "active",
      "author_id": 1,
      "editor_id": null,
      "created_at": "2026-10-28 09:25:06",
      "updated_at": null,
      "active": 1,
      "created_by": "mky",
      "updated_by": null
    }
  }
}
