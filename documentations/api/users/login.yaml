api: users
directory: api/users/
name: login (endpoint)
file: login.php
path: api/users/login.php
use_alerts:
  upon_success: true
  upon_failure: true
description: authenticates a user using their credentials
request:
  method: POST
  source: FormData
  fields:
  - name: username
    type: string (from text)
    required: true
    source: form
    description: user's username
  - name: password
    type: string (from text)
    required: true
    source: form
    description: user's password
response:
  content_type: application/json
  http_code:
    success: 200
    errors: ~400 - ~500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request (empty)
        - unsuccessful request
      properties:
        - name: redo_password
          type: bool
          returned: sometimes
          description: indicates whether password input should be re-inputted
          conditions:
            - when username or password is incorrect
        - name: redirect
          type: string
          returned: sometimes
          description: location to redirect to after login
          conditions:
            - after successful login

Example:
HTTP Status: 200
Response: {
  "message": "Successful, logging in.",
  "data": {
    "redirect": "index.php"
  }
}
