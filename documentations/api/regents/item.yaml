api: regents
directory: api/regents/
name: item (endpoint)
file: item.php
path: api/regents/item.php
use_alerts:
  upon_success: false
  upon_failure: true
description: retrieve a regent
authorization: superadmin only
request:
  method: GET
  source: URLSearchParams
  fields:
    - name: id
      type: int (from hidden)
      required: true
      source: js (url)
      description: id of a regent
response:
  content_type: application/json
  http_code:
    success: 200
    errors: ~400 - ~500
  fields:
    - name: message
      type: string
      returned: always
      description: a message describing the outcome of the request
      conditions:
        - after a successful or unsuccessful operation
      note:
        - do not include for alert upon success
    - name: data
      type: object
      returned: always (can be empty)
      description: contains the data returned by the endpoint
      conditions:
        - successful request
        - unsuccessful request (empty)
      properties:
        - name: regent
          type: object
          returned: always
          description: regent information
          conditions:
            - after a successful request
          properties:
            - every column in regents table = refer to db
            - name: created_by
              type: string
              returned: always (can be null)
              description: username of the user who created the regent
            - name: updated_by
              type: string
              returned: always (can be null)
              description: username of the user who last updated the regent
  errors:
    - status: 401
      message: You are unauthorized to make this request.
      when: the user is not logged in as superadmin
    - status: 404
      message: Regent does not exist.
      when: no active regent has the given id
    - status: 405
      message: Invalid request method.
      when: the request method is not GET
    - status: 422
      message: Invalid regent id.
      when: id is missing or not a positive whole number
    - status: 500
      message: An unexpected error occured.
      when: the server failed to process the request (see storage/logs/error.log)
example:
  http_status: 200
  response: |
    {
      "message": "Regent successfully fetched.",
      "data": {
        "regent": {
          "id": 1,
          "name": "Hon. Maria Lourdes Aquino",
          "position": "Chairperson",
          "biography": "Presides over meetings of the Board of Regents.",
          "featured_image": "bf6093f4da380c06b20a994a548466fb.webp",
          "order_number": 1,
          "status": "active",
          "author_id": 1,
          "editor_id": 1,
          "created_at": "2026-10-28 09:15:00",
          "updated_at": "2026-10-28 10:02:11",
          "active": 1,
          "created_by": "mky",
          "updated_by": "mky"
        }
      }
    }
